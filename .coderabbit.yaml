language: "en-US"
tone_instructions: "Be direct and concise. No fluff."

reviews:
  profile: "chill"
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  sequence_diagrams: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"
  path_filters:
    - "!.build/**"
    - "!**/*.xcodeproj/**"
    - "!**/*.xcworkspace/**"
    - "!Tests/AkouKitTests/Fixtures/**"
    - "!docs/images/**"
  path_instructions:
    - path: "Sources/**"
      instructions: |
        Check Swift 6 concurrency correctness (Sendable, actor isolation) and error handling.
        The Ogg and Opus code must follow RFC 3533 and RFC 7845; flag any change to page layout,
        granule positions or the CRC.
        Ensure no hardcoded credentials, keys or server addresses.
    - path: "Sources/AkouProtocol/**"
      instructions: |
        These types mirror akou's GET /v1/live protocol in docs/PROTOCOL.md; a change here must
        change that document too.
    - path: "App/**"
      instructions: |
        No signing team id or personal data may be committed. Check Info.plist privacy strings.
    - path: "Package.swift"
      instructions: |
        Dependencies must be pinned exactly. Platform minimums must match App/Config.
  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    swiftlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "local"
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
