# XcodeGen spec: `xcodegen generate --spec App/project.yml` writes App/AkouCompanion.xcodeproj,
# which is generated and never committed. Settings live in Config/*.xcconfig.
name: AkouCompanion
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
packages:
  AkouKit:
    path: ..
targets:
  AkouCompanion:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: AkouKit
        product: AkouKit
      - target: AkouCompanionWidgets
        embed: true
  # The Live Activity, the record control for the Action button, the Lock Screen and Control Center,
  # and the recent-recordings widget. Shared/ is in both targets: a control only offers an intent
  # that the app and the extension both contain. Each target has its own RecordIntentHost.
  AkouCompanionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    configFiles:
      Debug: Config/Widgets.xcconfig
      Release: Config/Widgets.xcconfig
    dependencies:
      - package: AkouKit
        product: AkouKit
  # The seams between the recorder, the intents, the uploader, the Library and the widgets, run in
  # the iOS Simulator inside the app. EndToEndTests runs only when given a server (see its header).
  AkouCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
    settings:
      # The app's product is akou.app (PRODUCT_NAME), not the target's name.
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/akou.app/akou
      BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: AkouCompanion
      # Imported, not linked: the app the tests run in already carries AkouKit.
      - package: AkouKit
        product: AkouKit
        link: false
schemes:
  AkouCompanion:
    build:
      targets:
        AkouCompanion: all
        AkouCompanionWidgets: all
    test:
      targets:
        - AkouCompanionTests
