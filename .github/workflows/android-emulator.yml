name: Android emulator

# The instrumented tests: libopus through :opus on an x86_64 emulator, then ffprobe on the stream the
# round-trip test hands back; and :app's real AudioRecord path into an Ogg Opus file, plus the
# Keystore. Not a required check until it has proved stable (docs/ANDROID.md, section 6).
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'Sources/COpusShim/**'
      - 'Tests/AkouKitTests/Fixtures/**'
      - '.github/workflows/android-emulator.yml'
  pull_request:
    paths:
      - 'android/opus/**'
      - 'android/app/**'
      - 'Sources/COpusShim/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

# Concurrency groups are repo-wide: a ci-* or android-* name here would cancel the other jobs.
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # ffprobeEncodedStream fails, never skips, without ffprobe. Same pinned build as android.yml.
      - name: Install ffprobe
        timeout-minutes: 5
        env:
          FFPROBE_URL: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-linux-x64.gz
          FFPROBE_SHA256: 25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067
        run: |
          mkdir -p "$RUNNER_TEMP/ffprobe"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffprobe.gz" "$FFPROBE_URL"
          echo "$FFPROBE_SHA256  $RUNNER_TEMP/ffprobe.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/ffprobe.gz" > "$RUNNER_TEMP/ffprobe/ffprobe"
          chmod +x "$RUNNER_TEMP/ffprobe/ffprobe"
          echo "$RUNNER_TEMP/ffprobe" >> "$GITHUB_PATH"

      # Built before the emulator starts, so the emulator's time is spent on tests only.
      - name: Build the test APK
        working-directory: android
        run: ./gradlew --no-daemon :opus:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          script: ./gradlew --no-daemon :opus:connectedDebugAndroidTest :app:connectedDebugAndroidTest

      # connectedDebugAndroidTest is finalized by ffprobeEncodedStream; this guard catches a run where
      # the device ran no tests at all.
      - name: Check the tests ran
        working-directory: android
        run: |
          for m in opus app; do
            if ! grep -qE 'tests="[1-9]' $m/build/outputs/androidTest-results/connected/debug/*.xml 2>/dev/null; then
              echo "::error::No :$m instrumented test results were written."
              exit 1
            fi
            grep -ho 'tests="[0-9]*" failures="[0-9]*"' $m/build/outputs/androidTest-results/connected/debug/*.xml
          done
