name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Concurrency groups are repo-wide: a ci-* name here would cancel the iOS jobs.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            android:
              - 'android/**'
              - 'Tests/AkouKitTests/Fixtures/**'
              - 'App/Sources/Demo/Samples/**'
              - 'docs/PROTOCOL.md'
              - '.github/workflows/android.yml'

      - name: Nothing Android changed
        if: steps.changes.outputs.android != 'true'
        run: echo "No change under the Android paths; passing."

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.changes.outputs.android == 'true'

      # The ffprobe parity test fails, never skips, without ffprobe.
      - name: Install ffmpeg
        if: steps.changes.outputs.android == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffprobe -version | head -1

      - name: Build and test
        if: steps.changes.outputs.android == 'true'
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          if grep -q "Executed 0 tests" "$RUNNER_TEMP/gradle.log"; then
            echo "::error::A test task ran no tests."
            exit 1
          fi
          if ! ls core/build/test-results/test/TEST-*.xml >/dev/null 2>&1; then
            echo "::error::No :core test results were written."
            exit 1
          fi
