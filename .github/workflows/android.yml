name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Concurrency groups are repo-wide: a ci-* name here would cancel the iOS jobs.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            android:
              - 'android/**'
              - 'Tests/AkouKitTests/Fixtures/**'
              - 'App/Sources/Demo/Samples/**'
              - 'Sources/COpusShim/**'
              - 'docs/PROTOCOL.md'
              - '.github/workflows/android.yml'

      - name: Nothing Android changed
        if: steps.changes.outputs.android != 'true'
        run: echo "No change under the Android paths; passing."

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.changes.outputs.android == 'true'
        with:
          distribution: temurin
          # 21 runs the :core tests (see android/core/build.gradle.kts); 17, listed last, stays JAVA_HOME.
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.changes.outputs.android == 'true'

      # The ffprobe parity test fails, never skips, without ffprobe. A pinned static ffprobe from a
      # GitHub release, checked by SHA-256: installing ffmpeg through apt stalled on slow mirrors.
      - name: Install ffprobe
        if: steps.changes.outputs.android == 'true'
        timeout-minutes: 5
        env:
          FFPROBE_URL: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffprobe-linux-x64.gz
          FFPROBE_SHA256: 25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067
        run: |
          mkdir -p "$RUNNER_TEMP/ffprobe"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffprobe.gz" "$FFPROBE_URL"
          echo "$FFPROBE_SHA256  $RUNNER_TEMP/ffprobe.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/ffprobe.gz" > "$RUNNER_TEMP/ffprobe/ffprobe"
          chmod +x "$RUNNER_TEMP/ffprobe/ffprobe"
          echo "$RUNNER_TEMP/ffprobe" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffprobe/ffprobe" -version | head -1

      - name: Build and test
        if: steps.changes.outputs.android == 'true'
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :opus:assemble :opus:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          if grep -q "Executed 0 tests" "$RUNNER_TEMP/gradle.log"; then
            echo "::error::A test task ran no tests."
            exit 1
          fi
          if ! ls core/build/test-results/test/TEST-*.xml >/dev/null 2>&1; then
            echo "::error::No :core test results were written."
            exit 1
          fi
          if ! ls app/build/test-results/testDebugUnitTest/TEST-*.xml >/dev/null 2>&1; then
            echo "::error::No :app test results were written."
            exit 1
          fi
